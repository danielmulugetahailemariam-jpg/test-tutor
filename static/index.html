<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bishoftu Tutoring Hub — Study Library</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #f4f6f9);
      --card: var(--tg-theme-secondary-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #18222d);
      --hint: var(--tg-theme-hint-color, #707579);
      --accent: var(--tg-theme-button-color, #2481cc);
      --accent-text: var(--tg-theme-button-text-color, #ffffff);
      --border: rgba(128, 128, 128, 0.18);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
      padding-bottom: 32px;
    }
    .hidden { display: none !important; }

    /* Status / Gate Screen */
    .gate-box {
      max-width: 420px;
      margin: 60px auto;
      padding: 28px 22px;
      background: var(--card);
      border-radius: 16px;
      text-align: center;
      border: 1px solid var(--border);
    }
    .gate-icon { font-size: 48px; margin-bottom: 12px; }
    .gate-box h2 { margin-bottom: 8px; font-size: 20px; }
    .gate-box p { color: var(--hint); font-size: 14px; }

    /* Header & Search */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--bg);
      padding: 12px 14px 10px;
      border-bottom: 1px solid var(--border);
    }
    .topbar-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .topbar-title { font-size: 17px; font-weight: 700; }
    .user-badge {
      font-size: 12px;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--card);
      color: var(--accent);
      font-weight: 600;
      border: 1px solid var(--border);
    }
    .search-input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .filters-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 8px;
    }
    .filter-select {
      width: 100%;
      padding: 8px 10px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 13px;
    }
    .count-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px 4px;
      font-size: 12px;
      color: var(--hint);
    }
    .clear-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Cards */
    .list { padding: 6px 14px; display: flex; flex-direction: column; gap: 10px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 12px 14px;
    }
    .card-title {
      font-size: 14px;
      font-weight: 600;
      word-break: break-word;
      margin-bottom: 8px;
    }
    .badges { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(36, 129, 204, 0.12);
      color: var(--accent);
      font-weight: 600;
    }
    .badge.green { background: rgba(34, 197, 94, 0.14); color: #16a34a; }
    .badge.amber { background: rgba(245, 158, 11, 0.15); color: #d97706; }
    .badge.gray { background: rgba(128, 128, 128, 0.14); color: var(--hint); }

    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn {
      flex: 1;
      min-width: 110px;
      padding: 9px 12px;
      border-radius: 9px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary { background: var(--accent); color: var(--accent-text); }
    .btn-secondary { background: rgba(128, 128, 128, 0.14); color: var(--text); }
    .btn-answer { background: #16a34a; color: #fff; }
    .load-more {
      margin: 14px auto;
      display: block;
      padding: 10px 24px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--accent);
      font-weight: 600;
      cursor: pointer;
    }

    /* Fullscreen PDF Reader Modal */
    .reader-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #1f242b;
      color: #fff;
      display: flex;
      flex-direction: column;
    }
    .reader-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #15191e;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .reader-title {
      flex: 1;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .r-btn {
      border: none;
      border-radius: 7px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      background: rgba(255,255,255,0.12);
      color: #fff;
    }
    .r-btn.answer-toggle { background: #16a34a; }
    .r-btn.answer-toggle.active { background: #f59e0b; color: #111; }

    .reader-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      background: #1b2027;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      font-size: 12px;
      gap: 6px;
    }
    .page-controls { display: flex; align-items: center; gap: 6px; }
    .page-input {
      width: 48px;
      padding: 4px;
      text-align: center;
      border-radius: 5px;
      border: 1px solid rgba(255,255,255,0.25);
      background: #111;
      color: #fff;
      font-size: 12px;
    }
    .reader-canvas-wrap {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 12px;
      position: relative;
      -webkit-overflow-scrolling: touch;
    }
    #pdfCanvas {
      background: #fff;
      box-shadow: 0 4px 24px rgba(0,0,0,0.45);
      max-width: none;
    }
    .reader-loading {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.75);
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 13px;
    }
    .reader-footer {
      display: flex;
      gap: 8px;
      padding: 8px 12px;
      background: #15191e;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #111827;
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      z-index: 200;
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    }
  </style>
</head>
<body>

  <!-- Loading / Gate View -->
  <div id="gateView" class="gate-box">
    <div class="gate-icon" id="gateIcon">⏳</div>
    <h2 id="gateTitle">Connecting to Bishoftu Tutoring Hub...</h2>
    <p id="gateMessage">Verifying your Telegram account.</p>
  </div>

  <!-- Main Library View -->
  <div id="libraryView" class="hidden">
    <div class="topbar">
      <div class="topbar-head">
        <div class="topbar-title">📚 Study Library</div>
        <div class="user-badge" id="userBadge">Approved</div>
      </div>
      <input type="search" id="searchInput" class="search-input" placeholder="Search exam, textbook, year, code (e.g. 2017 bio)..." />
      <div class="filters-grid">
        <select id="gradeFilter" class="filter-select"><option value="">All Grades</option></select>
        <select id="streamFilter" class="filter-select"><option value="">All Streams</option></select>
        <select id="subjectFilter" class="filter-select"><option value="">All Subjects</option></select>
        <select id="categoryFilter" class="filter-select"><option value="">All Categories</option></select>
      </div>
    </div>

    <div class="count-bar">
      <span id="resultCount">Loading...</span>
      <div>
        <button id="refreshBtn" class="clear-btn hidden" style="margin-right:10px;">🔄 Sync Cache</button>
        <button id="clearFiltersBtn" class="clear-btn">Reset Filters</button>
      </div>
    </div>

    <div id="cardList" class="list"></div>
    <button id="loadMoreBtn" class="load-more hidden">Show More</button>
  </div>

  <!-- In-App PDF Reader Modal -->
  <div id="readerModal" class="reader-modal hidden">
    <div class="reader-header">
      <button id="closeReaderBtn" class="r-btn">← Back</button>
      <div class="reader-title" id="readerTitle">Document</div>
      <button id="toggleAnswerBtn" class="r-btn answer-toggle hidden">🔑 Answer Key</button>
    </div>
    <div class="reader-toolbar">
      <div class="page-controls">
        <button id="prevPageBtn" class="r-btn">◀</button>
        <span><input id="pageInput" class="page-input" type="number" min="1" value="1" /> / <span id="pageCount">?</span></span>
        <button id="nextPageBtn" class="r-btn">▶</button>
      </div>
      <div class="page-controls">
        <button id="zoomOutBtn" class="r-btn">－</button>
        <span id="zoomLabel">100%</span>
        <button id="zoomInBtn" class="r-btn">＋</button>
      </div>
    </div>
    <div class="reader-canvas-wrap" id="canvasWrap">
      <canvas id="pdfCanvas"></canvas>
      <div id="readerLoading" class="reader-loading hidden">Loading page...</div>
    </div>
    <div class="reader-footer">
      <button id="readerSendChatBtn" class="btn btn-primary" style="font-size:12px;padding:8px;">📩 Send to Telegram</button>
      <button id="readerSaveBtn" class="btn btn-secondary" style="font-size:12px;padding:8px;color:#fff;">⬇️ Save PDF</button>
      <button id="readerOriginalBtn" class="btn btn-secondary hidden" style="font-size:12px;padding:8px;color:#fff;">📊 Original PPTX/DOCX</button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let sessionToken = "";
    let allItems = [];
    let itemsById = {};
    let filteredItems = [];
    let visibleLimit = 30;
    let isAdmin = false;

    // Reader State
    let readerMainDoc = null;
    let readerAnswerDoc = null;
    let showingAnswer = false;
    let currentPdfDoc = null;
    let currentPage = 1;
    let savedMainPage = 1;
    let savedAnswerPage = 1;
    let zoomMultiplier = 1.0;
    let renderTask = null;

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.remove("hidden");
      setTimeout(() => t.classList.add("hidden"), 2800);
    }

    function setGate(icon, title, message) {
      document.getElementById("gateIcon").textContent = icon;
      document.getElementById("gateTitle").textContent = title;
      document.getElementById("gateMessage").textContent = message;
    }

    async function initApp() {
      try {
        const res = await fetch("/api/auth", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ initData: tg.initData || "" }),
        });
        const data = await res.json();

        if (!data.ok) {
          if (data.status === "OUTSIDE_TELEGRAM") {
            setGate("📱", "Open Inside Telegram", "Please launch this Study Library from the bot button inside Telegram.");
          } else if (data.status === "NOT_REGISTERED") {
            setGate("📝", "Registration Required", "Please return to the bot chat and send /start to register first.");
          } else if (data.status === "NEW") {
            setGate("⏳", `Hi ${data.name}!`, "Your registration is pending admin approval. You will get a message as soon as it is approved.");
          } else {
            setGate("🚫", "Access Restricted", "Your registration is not approved. Contact the tutoring hub admin.");
          }
          return;
        }

        sessionToken = data.token;
        isAdmin = !!data.is_admin;
        document.getElementById("userBadge").textContent = data.grade ? `${data.name} • ${data.grade}` : data.name;
        if (isAdmin) document.getElementById("refreshBtn").classList.remove("hidden");

        await loadLibrary(false);
        document.getElementById("gateView").classList.add("hidden");
        document.getElementById("libraryView").classList.remove("hidden");
      } catch (err) {
        setGate("⚠️", "Connection Error", "Could not connect to server. Please try again.");
      }
    }

    async function loadLibrary(forceRefresh) {
      const url = forceRefresh ? "/api/library?refresh=true" : "/api/library";
      const res = await fetch(url, { headers: { Authorization: `Bearer ${sessionToken}` } });
      const data = await res.json();
      allItems = data.items || [];
      itemsById = {};
      allItems.forEach((it) => { itemsById[it.doc_id] = it; });

      populateSelect("gradeFilter", uniqueVals("grade"), "All Grades");
      populateSelect("streamFilter", uniqueVals("stream"), "All Streams");
      populateSelect("subjectFilter", uniqueVals("subject"), "All Subjects");
      populateSelect("categoryFilter", uniqueVals("category"), "All Categories");

      applyFilters();
    }

    function uniqueVals(field) {
      return [...new Set(allItems.map((i) => i[field]).filter(Boolean))].sort();
    }

    function populateSelect(id, values, label) {
      const sel = document.getElementById(id);
      const prev = sel.value;
      sel.innerHTML = `<option value="">${label}</option>`;
      values.forEach((v) => {
        const opt = document.createElement("option");
        opt.value = v;
        opt.textContent = v;
        sel.appendChild(opt);
      });
      if (values.includes(prev)) sel.value = prev;
    }

    function applyFilters() {
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      const g = document.getElementById("gradeFilter").value;
      const st = document.getElementById("streamFilter").value;
      const sub = document.getElementById("subjectFilter").value;
      const cat = document.getElementById("categoryFilter").value;

      filteredItems = allItems.filter((it) => {
        if (g && it.grade !== g) return false;
        if (st && it.stream !== st) return false;
        if (sub && it.subject !== sub) return false;
        if (cat && it.category !== cat) return false;
        if (q) {
          const hay = `${it.file_name} ${it.subject} ${it.category} ${it.year} ${it.grade} ${it.round_or_code}`.toLowerCase();
          if (!q.split(/\s+/).every((word) => hay.includes(word))) return false;
        }
        return true;
      });

      visibleLimit = 30;
      renderCards();
    }

    function renderCards() {
      const list = document.getElementById("cardList");
      const countEl = document.getElementById("resultCount");
      const loadMoreBtn = document.getElementById("loadMoreBtn");

      countEl.textContent = `${filteredItems.length} resource${filteredItems.length === 1 ? "" : "s"} found`;
      list.innerHTML = "";

      const slice = filteredItems.slice(0, visibleLimit);
      slice.forEach((it) => {
        const card = document.createElement("div");
        card.className = "card";

        const badgesHtml = [
          it.grade ? `<span class="badge">${escapeHtml(it.grade)}</span>` : "",
          it.subject ? `<span class="badge">${escapeHtml(it.subject)}</span>` : "",
          it.category ? `<span class="badge gray">${escapeHtml(it.category)}</span>` : "",
          it.year ? `<span class="badge amber">${escapeHtml(it.year)}</span>` : "",
          it.round_or_code ? `<span class="badge gray">${escapeHtml(it.round_or_code)}</span>` : "",
          it.linked_doc_id && it.category !== "Answer Sheet"
            ? `<span class="badge green">🔑 Answer Linked</span>`
            : (it.has_embedded_answer === "Yes" && it.category !== "Answer Sheet" ? `<span class="badge green">✔ With Answers</span>` : ""),
          it.file_size_mb ? `<span class="badge gray">${it.file_size_mb} MB</span>` : "",
        ].join("");

        card.innerHTML = `
          <div class="card-title">${escapeHtml(it.file_name)}</div>
          <div class="badges">${badgesHtml}</div>
          <div class="actions"></div>
        `;

        const actions = card.querySelector(".actions");
        if (it.has_pdf) {
          const readBtn = document.createElement("button");
          readBtn.className = "btn btn-primary";
          readBtn.textContent = "📖 Read Here";
          readBtn.onclick = () => openReader(it, false);
          actions.appendChild(readBtn);
        }

        if (it.linked_doc_id && itemsById[it.linked_doc_id] && it.category !== "Answer Sheet") {
          const ansBtn = document.createElement("button");
          ansBtn.className = "btn btn-answer";
          ansBtn.textContent = "🔑 Answer Key";
          ansBtn.onclick = () => openReader(it, true);
          actions.appendChild(ansBtn);
        }

        const sendBtn = document.createElement("button");
        sendBtn.className = "btn btn-secondary";
        sendBtn.textContent = "📩 Send to Chat";
        sendBtn.onclick = () => sendToChat(it, it.has_pdf ? "pdf" : "original");
        actions.appendChild(sendBtn);

        if (it.has_original_office) {
          const origBtn = document.createElement("button");
          origBtn.className = "btn btn-secondary";
          origBtn.textContent = "⬇️ PPTX/DOCX";
          origBtn.onclick = () => downloadDirect(it, "original");
          actions.appendChild(origBtn);
        }

        list.appendChild(card);
      });

      if (filteredItems.length > visibleLimit) {
        loadMoreBtn.classList.remove("hidden");
        loadMoreBtn.textContent = `Show More (${filteredItems.length - visibleLimit} remaining)`;
      } else {
        loadMoreBtn.classList.add("hidden");
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    async function sendToChat(item, variant = "pdf") {
      showToast("Sending to your Telegram chat...");
      try {
        const res = await fetch(`/api/file/${item.doc_id}/send?variant=${variant}`, {
          method: "POST",
          headers: { Authorization: `Bearer ${sessionToken}` },
        });
        const data = await res.json();
        if (data.ok) {
          showToast("✅ Sent to your Telegram chat!");
        } else if (data.too_large_for_bot) {
          showToast("⚠️ Over 50 MB—starting direct download...");
          downloadDirect(item, variant);
        } else {
          showToast("❌ Could not send file.");
        }
      } catch {
        showToast("❌ Network error sending file.");
      }
    }

    function downloadDirect(item, variant = "pdf") {
      const dlUrl = `${window.location.origin}/api/file/${item.doc_id}/download?token=${encodeURIComponent(sessionToken)}&variant=${variant}`;
      let fname = item.file_name;
      if (variant === "pdf" && !fname.toLowerCase().endsWith(".pdf")) {
        fname = fname.replace(/\.(pptx|docx)$/i, "") + ".pdf";
      }
      if (tg.downloadFile) {
        tg.downloadFile({ url: dlUrl, file_name: fname });
      } else {
        tg.openLink(dlUrl);
      }
    }

    // ================= IN-APP PROGRESSIVE PDF READER =================
    async function openReader(mainItem, startWithAnswer = false) {
      readerMainDoc = mainItem;
      readerAnswerDoc = (mainItem.linked_doc_id && itemsById[mainItem.linked_doc_id]) ? itemsById[mainItem.linked_doc_id] : null;
      showingAnswer = startWithAnswer && !!readerAnswerDoc;
      savedMainPage = 1;
      savedAnswerPage = 1;
      zoomMultiplier = 1.0;
      document.getElementById("zoomLabel").textContent = "100%";

      const ansToggle = document.getElementById("toggleAnswerBtn");
      if (readerAnswerDoc) {
        ansToggle.classList.remove("hidden");
      } else {
        ansToggle.classList.add("hidden");
      }

      const origBtn = document.getElementById("readerOriginalBtn");
      if (mainItem.has_original_office) origBtn.classList.remove("hidden");
      else origBtn.classList.add("hidden");

      document.getElementById("readerModal").classList.remove("hidden");
      await loadActiveReaderDoc();
    }

    async function loadActiveReaderDoc() {
      const activeDoc = showingAnswer && readerAnswerDoc ? readerAnswerDoc : readerMainDoc;
      document.getElementById("readerTitle").textContent = activeDoc.file_name;

      const ansToggle = document.getElementById("toggleAnswerBtn");
      if (readerAnswerDoc) {
        if (showingAnswer) {
          ansToggle.textContent = "📄 Back to Exam";
          ansToggle.classList.add("active");
        } else {
          ansToggle.textContent = "🔑 Answer Key";
          ansToggle.classList.remove("active");
        }
      }

      const loadingEl = document.getElementById("readerLoading");
      loadingEl.classList.remove("hidden");
      loadingEl.textContent = "Opening PDF...";

      const streamUrl = `/api/file/${activeDoc.doc_id}/stream?token=${encodeURIComponent(sessionToken)}&variant=pdf`;
      try {
        if (currentPdfDoc) {
          try { await currentPdfDoc.destroy(); } catch {}
        }
        const task = pdfjsLib.getDocument({
          url: streamUrl,
          rangeChunkSize: 65536,
          disableAutoFetch: true,
          disableStream: true,
        });
        currentPdfDoc = await task.promise;
        document.getElementById("pageCount").textContent = currentPdfDoc.numPages;

        currentPage = showingAnswer ? savedAnswerPage : savedMainPage;
        if (currentPage > currentPdfDoc.numPages) currentPage = 1;
        await renderPage(currentPage);
      } catch (e) {
        console.error(e);
        loadingEl.textContent = "Failed to load PDF. Try 'Send to Telegram'.";
      }
    }

    async function renderPage(num) {
      if (!currentPdfDoc) return;
      const loadingEl = document.getElementById("readerLoading");
      loadingEl.classList.remove("hidden");
      loadingEl.textContent = `Loading page ${num}...`;

      if (renderTask) {
        try { renderTask.cancel(); } catch {}
      }

      const page = await currentPdfDoc.getPage(num);
      const wrap = document.getElementById("canvasWrap");
      const baseViewport = page.getViewport({ scale: 1 });
      const fitScale = Math.max(0.5, (wrap.clientWidth - 24) / baseViewport.width);
      const scale = fitScale * zoomMultiplier;
      const outputScale = window.devicePixelRatio || 1;

      const viewport = page.getViewport({ scale });
      const canvas = document.getElementById("pdfCanvas");
      const ctx = canvas.getContext("2d");

      canvas.width = Math.floor(viewport.width * outputScale);
      canvas.height = Math.floor(viewport.height * outputScale);
      canvas.style.width = `${Math.floor(viewport.width)}px`;
      canvas.style.height = `${Math.floor(viewport.height)}px`;

      const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;
      renderTask = page.render({ canvasContext: ctx, transform, viewport });
      try {
        await renderTask.promise;
        document.getElementById("pageInput").value = num;
        if (showingAnswer) savedAnswerPage = num;
        else savedMainPage = num;
        wrap.scrollTop = 0;
      } catch (err) {
        if (err?.name !== "RenderingCancelledException") console.error(err);
      } finally {
        loadingEl.classList.add("hidden");
      }
    }

    // UI Listeners
    ["searchInput", "gradeFilter", "streamFilter", "subjectFilter", "categoryFilter"].forEach((id) => {
      document.getElementById(id).addEventListener("input", applyFilters);
      document.getElementById(id).addEventListener("change", applyFilters);
    });
    document.getElementById("clearFiltersBtn").onclick = () => {
      document.getElementById("searchInput").value = "";
      document.getElementById("gradeFilter").value = "";
      document.getElementById("streamFilter").value = "";
      document.getElementById("subjectFilter").value = "";
      document.getElementById("categoryFilter").value = "";
      applyFilters();
    };
    document.getElementById("refreshBtn").onclick = async () => {
      showToast("Refreshing library...");
      await loadLibrary(true);
      showToast("✅ Library refreshed!");
    };
    document.getElementById("loadMoreBtn").onclick = () => {
      visibleLimit += 30;
      renderCards();
    };

    // Reader Controls
    document.getElementById("closeReaderBtn").onclick = async () => {
      document.getElementById("readerModal").classList.add("hidden");
      if (currentPdfDoc) {
        try { await currentPdfDoc.destroy(); } catch {}
        currentPdfDoc = null;
      }
    };
    document.getElementById("toggleAnswerBtn").onclick = async () => {
      showingAnswer = !showingAnswer;
      await loadActiveReaderDoc();
    };
    document.getElementById("prevPageBtn").onclick = () => {
      if (currentPage > 1) { currentPage--; renderPage(currentPage); }
    };
    document.getElementById("nextPageBtn").onclick = () => {
      if (currentPdfDoc && currentPage < currentPdfDoc.numPages) { currentPage++; renderPage(currentPage); }
    };
    document.getElementById("pageInput").onchange = (e) => {
      const val = parseInt(e.target.value, 10);
      if (currentPdfDoc && val >= 1 && val <= currentPdfDoc.numPages) {
        currentPage = val;
        renderPage(currentPage);
      }
    };
    document.getElementById("zoomInBtn").onclick = () => {
      zoomMultiplier = Math.min(2.5, zoomMultiplier + 0.25);
      document.getElementById("zoomLabel").textContent = `${Math.round(zoomMultiplier * 100)}%`;
      renderPage(currentPage);
    };
    document.getElementById("zoomOutBtn").onclick = () => {
      zoomMultiplier = Math.max(0.6, zoomMultiplier - 0.25);
      document.getElementById("zoomLabel").textContent = `${Math.round(zoomMultiplier * 100)}%`;
      renderPage(currentPage);
    };
    document.getElementById("readerSendChatBtn").onclick = () => {
      const activeDoc = showingAnswer && readerAnswerDoc ? readerAnswerDoc : readerMainDoc;
      if (activeDoc) sendToChat(activeDoc, "pdf");
    };
    document.getElementById("readerSaveBtn").onclick = () => {
      const activeDoc = showingAnswer && readerAnswerDoc ? readerAnswerDoc : readerMainDoc;
      if (activeDoc) downloadDirect(activeDoc, "pdf");
    };
    document.getElementById("readerOriginalBtn").onclick = () => {
      if (readerMainDoc) downloadDirect(readerMainDoc, "original");
    };

    initApp();
  </script>
</body>
</html>
